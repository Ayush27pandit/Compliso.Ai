# Guardrails configuration for Compliso.ai
# Lightweight implementation compatible with LangGraph

models:
  main:
    engine: groq
    model: llama-3.3-70b-versatile
    temperature: 0.3
    max_tokens: 2048

  rails:
    engine: groq
    model: llama-3.1-8b-instant
    temperature: 0.1
    max_tokens: 512

rails:
  input:
    enabled: true
    flows:
      - jailbreak_detection
      - prompt_injection_blocking
      - pii_masking

  output:
    enabled: true
    flows:
      - self_check_output
      - verify_citations
      - detect_hallucination

  retrieval:
    enabled: true
    flows:
      - source_authority_check
      - outdated_rejection

logging:
  enabled: true
  log_dir: guardrails/logs
