    /* =========================================================
       HELPERS
       ========================================================= */
    const cls = (...x) => x.filter(Boolean).join(" ");

    function CountUp({ to, duration = 1800, prefix = "", suffix = "", decimals = 0 }) {
      const ref = useRef(null);
      const inView = useInView(ref, { once: true, margin: "-60px" });
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!inView) return;
        const startTs = performance.now();
        let raf;
        const step = (ts) => {
          const p = Math.min((ts - startTs) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          setVal(to * eased);
          if (p < 1) raf = requestAnimationFrame(step);
        };
        raf = requestAnimationFrame(step);
        return () => cancelAnimationFrame(raf);
      }, [inView, to, duration]);
      const formatted = val.toLocaleString("en-IN", {
        maximumFractionDigits: decimals,
        minimumFractionDigits: decimals,
      });
      return <span ref={ref}>{prefix}{formatted}{suffix}</span>;
    }

    /* =========================================================
       NAV
       ========================================================= */

      const [scrolled, setScrolled] = useState(false);
      const [open, setOpen] = useState(false);
      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 16);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      const links = [

        { label: "How it works", href: "#how" },
        { label: "Pricing",   href: "#pricing" },
        { label: "Customers", href: "#testimonials" },

      return (

            scrolled

                </a>
              ))}
            </nav>

            <div className="hidden lg:flex items-center gap-3">

                Start free trial
                <IconArrow className="w-3.5 h-3.5 transition-transform group-hover:translate-x-0.5" />
              </a>
            </div>

            <button onClick={() => setOpen(!open)} className="lg:hidden p-2 text-ink-100" aria-label="Menu">
              {open ? <IconX className="w-6 h-6" /> : <IconMenu className="w-6 h-6" />}
            </button>
          </div>

          <AnimatePresence>
            {open && (
              <motion.div
                initial={{ height: 0, opacity: 0 }}
                animate={{ height: "auto", opacity: 1 }}
                exit={{ height: 0, opacity: 0 }}
                transition={{ duration: 0.25 }}

                  ))}

                    Start free trial

    /* =========================================================

    function Hero() {
      const videoRef = useRef(null);

      const { scrollYProgress } = useScroll({ target: heroRef, offset: ["start start", "end start"] });
      const y = useTransform(scrollYProgress, [0, 1], [0, 120]);
      const opacity = useTransform(scrollYProgress, [0, 0.9], [1, 0]);
      const [typeIdx, setTypeIdx] = useState(0);
      const queries = [
        "Is ITC available on festive marketing expenses?",
        "What changed in GSTR-9 for FY 2024-25?",
        "Reconcile my 2A vs 2B for the last quarter.",
        "Decode this DRC-01 notice I just received.",

      useEffect(() => {
        const t = setInterval(() => setTypeIdx((i) => (i + 1) % queries.length), 3200);

      return (

            <div className="max-w-3xl">

                initial={{ opacity: 0, y: 10 }}
                animate={{ opacity: 1, y: 0 }}
                transition={{ delay: 0.1, duration: 0.6 }}
                className="inline-flex items-center gap-2.5 px-3 h-8 rounded-full bg-white/[0.04] border border-white/10 text-[12.5px] font-medium text-ink-200 backdrop-blur-md"

                  <span className="absolute inset-0 rounded-full bg-accent-400 animate-ping opacity-70" />
                  <span className="relative inline-flex rounded-full h-1.5 w-1.5 bg-accent-400" />

                New · CBIC Notification 04/2026 indexed 2h ago
              </motion.div>

              <motion.h1
